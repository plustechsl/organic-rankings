# Override de DESARROLLO (se aplica solo con `docker compose up`, no con `docker compose -f`).
# En WSL / local: recarga en caliente de la API y `npm run dev` del frontend,
# con el puerto 8000 publicado para depurar contra la API directamente.

services:

  api:
    volumes:
      - ./api/app:/app/app
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./web
      target: builder
    command: ["npm", "run", "dev"]
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
